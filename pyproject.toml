[project]
name = "enterprise-data-insights"
version = "0.1.0"
description = "CSV quality checks, SQL reports and Hadoop Streaming compatible aggregation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["datahub", "jobs"]

[tool.pytest.ini_options]
pythonpath = ["."]
